<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Administrador</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

    <div class="container">
        <div class="auth-seccion">
            <div class="tarjeta-auth">
                <h2>Registrar Admin</h2>
                <p>Crea un nuevo perfil para gestionar la plataforma.</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <ul class="alertas-flask">
                        {% for category, message in messages %}
                            <li class="alerta-item {{ category }}">{{ message }}</li>
                        {% endfor %}
                        </ul>
                    {% endif %}
                {% endwith %}

                <form action="{{ url_for('register') }}" method="POST">
                    <div class="grupo-input" style="text-align: left;">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                    </div>

                    <div class="grupo-input" style="text-align: left;">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="admin@tienda.com" required>
                    </div>

                    <div class="grupo-input" style="text-align: left;">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-enviar" style="margin-top: 10px;">Crear Cuenta</button>
                </form>

                <p style="margin-top: 25px; font-size: 0.9rem; color: #666;">
                    ¿Ya eres administrador? <a href="{{ url_for('login') }}" style="color: #c254d8; font-weight: bold; text-decoration: none;">Inicia Sesión</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
