<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="panel-container">
        
        <aside class="sidebar-left">
            <div class="sidebar-logo">
                <h2>Panel Sofía</h2>
            </div>
            <nav class="sidebar-menu">
                <a href="{{ url_for('dashboard') }}" class="active"><i class="bi bi-house-door"></i> Inicio Panel</a>
                <a href="{{ url_for('dashboard_productos') }}"><i class="bi bi-box-seam"></i> Gestionar Catálogo</a>
                <a href="{{ url_for('inicio') }}"><i class="bi bi-globe"></i> Ir a la Web Pública</a>
                <a href="{{ url_for('logout') }}" class="logout-link" style="color: #dc3545;"><i class="bi bi-door-open"></i> Cerrar Sesión</a>
            </nav>
        </aside>

        <main class="main-panel" style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 80px);">
            <div style="text-align: center; background: white; padding: 40px 60px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border-top: 6px solid #e999eb;">
                <span style="font-size: 3.5rem; display: block; margin-bottom: 15px;">✨</span>
                <h2 style="color: #99558B; margin-top: 0; margin-bottom: 10px; font-size: 2rem;">¡Bienvenida al Panel!</h2>
                <p style="font-size: 1rem; color: #666; margin: 0; max-width: 320px; line-height: 1.5;">
                    Selecciona una opción de la barra lateral para empezar a administrar tu catálogo.
                </p>
            </div>
        </main>

    </div>

</body>
</html>
